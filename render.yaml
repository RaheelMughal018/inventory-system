services:
  - type: web
    name: inventory-backend
    env: python
    region: oregon
    plan: starter
    buildCommand: pip install -r requirement.txt
    startCommand: ./entrypoint.sh
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: inventory-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 120

databases:
  - name: inventory-db
    databaseName: inventory_db
    user: inventory_user
    plan: starter
